- title: "PhoenixBot: An Autonomous Mechanical Precision Weeding System for Small-Scale Organic Farms"
  image: phoenixbot.png
  description: "We present PhoenixBot, an affordable, autonomous robotic system for precision weeding. The system combines color-based segmentation with clustering and deep learning-based classification for weed detection and localization, a delta-arm weeder for targeted weed removal, and a vision-based crop row-following algorithm for field navigation."
  authors: Maya W. Adelman, Dexter Friis-Hecht, Dokyun Kim, Joseph G. Leedy, Brooke A. M. Moss, Chang Jun Park, Kenechukwu C. Mbanisi 
  link:
    url: https://www.sciencedirect.com/science/article/pii/S2405896325024656
    display: ScienceDirect (2025)
  highlight: 1

- title: "PhoenixBot: Towards an ecological weed management robotic system"
  image: phoenixbot_concept.png
  description: "We propose a hybrid robotic system, PhoenixBot, rooted in ecological weed management (EWM), aimed at achieving sustainable weed management while simultaneously maintaining or enhancing crop yields. This proposed system eliminates herbicide use, minimizes soil inversion and selectively regulates non-crop populations on the farm."
  authors: Brooke A. M. Moss, Maya W. Adelman, Mia Chevere, Dokyun Kim, Kenechukwu C. Mbanisi
  link:
    url: https://www.researchgate.net/publication/381302958_ICRA_2024_Abstract
    display: ResearchGate (2024)
